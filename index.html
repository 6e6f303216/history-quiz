<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исторический квиз</title>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            height: 100vh;
            color: #3c3c3c;
        }
        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        .progress-bar-container {
            flex-grow: 1;
            background-color: #e5e5e5;
            border-radius: 10px;
            height: 16px;
            overflow: hidden;
        }
        .progress-bar {
            background-color: #58cc02;
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 30px;
            line-height: 1.4;
            text-align: center;
        }
        h3 {
            font-size: 18px;
            margin: 0 0 15px 0;
            text-align: center;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }
        .options-grid {
            display: grid;
            grid-template-columns: max-content max-content;
            justify-content: center;
            gap: 15px;
        }
        .option {
            border: 2px solid #e5e5e5;
            border-bottom-width: 4px;
            border-radius: 16px;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.1s ease;
            user-select: none;
        }
        .option.option-image {
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .option:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }
        .option.selected {
            border-color: #84d8ff;
            background-color: #ddf4ff;
            color: #1cb0f6;
        }
        .option.correct {
            border-color: #58cc02;
            background-color: #d7ffb8;
            color: #58a700;
        }
        .option.wrong {
            border-color: #ea2b2b;
            background-color: #ffdfe0;
            color: #ea2b2b;
        }
        .hidden {
            display: none !important;
        }
        #result-screen {
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .score-text {
            font-size: 24px;
            font-weight: bold;
            color: #58cc02;
            margin-bottom: 30px;
        }
        .btn {
            width: 100%;
            background-color: #58cc02;
            color: white;
            border: 0;
            border-bottom: 4px solid #58a700;
            border-radius: 16px;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s ease;
            margin-top: 20px;
        }
        .btn:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }
        .btn:disabled {
            background-color: #e5e5e5;
            border-color: #e5e5e5;
            color: #afafaf;
            cursor: default;
            transform: none;
            border-bottom-width: 4px;
        }
        .question-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .portrait {
            width: 140px;
            height: 140px;
            border-radius: 24px;
            object-fit: cover;
            border: 4px solid #e5e5e5;
            margin-bottom: 15px;
        }
        .portrait-option {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }
        .person-years {
            font-size: 18px;
            color: #777;
            font-weight: bold;
            margin-bottom: 25px;
        }
        #input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }
        #date-input {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            color: #3c3c3c;
            border: 2px solid #e5e5e5;
            border-radius: 16px;
            box-sizing: border-box;
            font-family: inherit;
            text-align: center;
            outline: none;
            transition: all 0.2s ease;
        }
        #date-input.correct-input {
            border-color: #58cc02;
            background-color: #d7ffb8;
            color: #58a700;
        }
        #date-input.wrong-input {
            border-color: #ea2b2b;
            background-color: #ffdfe0;
            color: #ea2b2b;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header" id="header">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <div id="quiz-screen">
        <div class="question-header" id="question-header"></div>
        <div class="options" id="options-container"></div>
        
        <div id="input-container" class="hidden">
            <input type="text" id="date-input" placeholder="Введи год..." autocomplete="off">
            <button id="submit-btn" class="btn" onclick="checkInput()">Проверить</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Урок завершён!</h2>
        <div class="score-text" id="score-text"></div>
        <button class="btn" onclick="startGame()">Пройти заново</button>
    </div>
</div>

        {"name": "Борис Николаевич Ельцин", "years": "1991-1999", "image": "images/image33.png"},
        {"name": "Путин Владимир Владимирович", "years": "2000-2008, 2012 – по сей день", "image": "images/image34.png"},
        {"name": "Дмитрий Анатольевич Медведев", "years": "2008-2012", "image": "images/image35.png"}

    const totalQuestions = 7;
    let quizData = [];
    let currentIndex = 0;
    let score = 0;
    let currentCorrectAnswer = '';
    let isProcessing = false;

    const questionHeader = document.getElementById('question-header');
    const optionsContainer = document.getElementById('options-container');
    const inputContainer = document.getElementById('input-container');
    const dateInput = document.getElementById('date-input');
    const submitBtn = document.getElementById('submit-btn');
    const progressBar = document.getElementById('progress-bar');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const scoreText = document.getElementById('score-text');
    const header = document.getElementById('header');

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startGame() {
        quizData = shuffle([...allData]).slice(0, totalQuestions);
        currentIndex = 0;
        score = 0;
        isProcessing = false;
        quizScreen.classList.remove('hidden');
        resultScreen.classList.add('hidden');
        header.classList.remove('hidden');
        updateProgress(0);
        loadQuestion();
    }

    function loadQuestion() {
        const currentItem = quizData[currentIndex];
        optionsContainer.innerHTML = '';
        optionsContainer.className = 'options';
        optionsContainer.classList.remove('hidden');
        inputContainer.classList.add('hidden');
        
        dateInput.value = '';
        dateInput.className = '';
        dateInput.disabled = false;
        submitBtn.disabled = false;
        isProcessing = false;

        let optionsList = [];
        let isImageMode = false;

        if (currentItem.event) {
            const mode = Math.floor(Math.random() * 3);

            if (mode === 0) {
                // Выбор даты из вариантов
                questionHeader.innerHTML = `<h2>${currentItem.event}</h2>`;
                currentCorrectAnswer = currentItem.date;
                
                let wrongAnswers = allData
                    .filter(d => d.event && d.date !== currentItem.date)
                    .map(d => d.date);
                wrongAnswers = shuffle(wrongAnswers).slice(0, 3);
                optionsList = shuffle([currentCorrectAnswer, ...wrongAnswers]);

            } else if (mode === 1) {
                // Выбор события из вариантов
                questionHeader.innerHTML = `<h2>${currentItem.date}</h2>`;
                currentCorrectAnswer = currentItem.event;

                let wrongAnswers = allData
                    .filter(d => d.event && d.event !== currentItem.event)
                    .map(d => d.event);
                wrongAnswers = shuffle(wrongAnswers).slice(0, 3);
                optionsList = shuffle([currentCorrectAnswer, ...wrongAnswers]);

            } else {
                // Ввод даты вручную
                optionsContainer.classList.add('hidden');
                inputContainer.classList.remove('hidden');
                questionHeader.innerHTML = `<h2>${currentItem.event}</h2>`;
                currentCorrectAnswer = currentItem.date;
                setTimeout(() => dateInput.focus(), 50);
                return; // Выходим, так как варианты создавать здесь нужно
            }
        } else {
            const isGuessPortrait = Math.random() > 0.5;
            
            if (isGuessPortrait) {
                isImageMode = true;
                optionsContainer.classList.add('options-grid');
                questionHeader.innerHTML = `
                    <h2 style="margin-bottom: 5px;">Где изображён</h2>
                    <h3>${currentItem.name}?</h3>
                    <div class="person-years">${currentItem.years}</div>
                `;
                currentCorrectAnswer = currentItem.image;

                let wrongAnswers = allData
                    .filter(d => d.name && d.image !== currentItem.image)
                    .map(d => d.image);
                wrongAnswers = shuffle(wrongAnswers).slice(0, 3);
                optionsList = shuffle([currentCorrectAnswer, ...wrongAnswers]);
            } else {
                questionHeader.innerHTML = `
                    <img src="${currentItem.image}" alt="Портрет" class="portrait">
                    <h2 style="margin-bottom: 5px;">Кто на портрете?</h2>
                    <div class="person-years">${currentItem.years}</div>
                `;
                currentCorrectAnswer = currentItem.name;

                let wrongAnswers = allData
                    .filter(d => d.name && d.name !== currentItem.name)
                    .map(d => d.name);
                wrongAnswers = shuffle(wrongAnswers).slice(0, 3);
                optionsList = shuffle([currentCorrectAnswer, ...wrongAnswers]);
            }
        }

        optionsList.forEach(value => {
            const div = document.createElement('div');
            div.className = isImageMode ? 'option option-image' : 'option';
            div.dataset.value = value;
            
            if (isImageMode) {
                div.innerHTML = `<img src="${value}" class="portrait-option" alt="Вариант ответа">`;
            } else {
                div.textContent = value;
            }
            
            div.onclick = () => selectOption(div);
            optionsContainer.appendChild(div);
        });
    }

    function selectOption(div) {
        if (isProcessing) return; 
        isProcessing = true;
        
        div.classList.add('selected');

        document.querySelectorAll('.option').forEach(el => {
            if (el.dataset.value === currentCorrectAnswer) {
                el.classList.add('correct');
            }
            const isWrongSelected = el.classList.contains('selected') && el.dataset.value !== currentCorrectAnswer;
            if (isWrongSelected) {
                el.classList.add('wrong');
            }
        });

        if (div.dataset.value === currentCorrectAnswer) {
            score++;
        }

        proceedToNext();
    }

    function checkInput() {
        if (isProcessing) return;
        const userAnswer = dateInput.value.trim();
        if (userAnswer === '') return;

        isProcessing = true;
        dateInput.disabled = true;
        submitBtn.disabled = true;

        if (userAnswer === currentCorrectAnswer) {
            score++;
            dateInput.classList.add('correct-input');
        } else {
            dateInput.classList.add('wrong-input');
            dateInput.value = `${userAnswer} (Верно: ${currentCorrectAnswer})`;
        }

        proceedToNext();
    }

    dateInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkInput();
        }
    });

    function proceedToNext() {
        updateProgress(((currentIndex + 1) / totalQuestions) * 100);
        
        setTimeout(() => {
            currentIndex++;
            if (currentIndex < totalQuestions) {
                loadQuestion();
            } else {
                showResults();
            }
        }, 1500);
    }

    function updateProgress(value) {
        progressBar.style.width = `${value}%`;
    }

    function showResults() {
        quizScreen.classList.add('hidden');
        header.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        scoreText.textContent = `Твой результат: ${score} из ${totalQuestions}`;
    }

    startGame();
</script>
