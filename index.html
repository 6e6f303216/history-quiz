<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исторический квиз</title>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            height: 100vh;
            color: #3c3c3c;
        }
        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        .progress-bar-container {
            flex-grow: 1;
            background-color: #e5e5e5;
            border-radius: 10px;
            height: 16px;
            overflow: hidden;
        }
        .progress-bar {
            background-color: #58cc02;
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 30px;
            line-height: 1.4;
            text-align: center;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }
        .option {
            border: 2px solid #e5e5e5;
            border-bottom-width: 4px;
            border-radius: 16px;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.1s ease;
            user-select: none;
        }
        .option:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }
        .option.selected {
            border-color: #84d8ff;
            background-color: #ddf4ff;
            color: #1cb0f6;
        }
        .option.correct {
            border-color: #58cc02;
            background-color: #d7ffb8;
            color: #58a700;
        }
        .option.wrong {
            border-color: #ea2b2b;
            background-color: #ffdfe0;
            color: #ea2b2b;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #e5e5e5;
        }
        .btn {
            width: 100%;
            background-color: #58cc02;
            color: white;
            border: none;
            border-bottom: 4px solid #58a700;
            border-radius: 16px;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .btn:active:disabled {
            transform: none;
            border-bottom-width: 0px;
        }
        .btn:active:enabled {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }
        .btn:disabled {
            background-color: #e5e5e5;
            color: #afafaf;
            border-bottom-color: #cecece;
            cursor: default;
        }
        .btn.continue {
            background-color: #1cb0f6;
            border-bottom-color: #1899d6;
        }
        .hidden {
            display: none !important;
        }
        #result-screen {
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .score-text {
            font-size: 24px;
            font-weight: bold;
            color: #58cc02;
            margin-bottom: 30px;
        }
        /* Стили для портретов */
        .question-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .portrait {
            width: 140px;
            height: 140px;
            border-radius: 24px;
            object-fit: cover;
            border: 4px solid #e5e5e5;
            margin-bottom: 15px;
        }
        .person-years {
            font-size: 18px;
            color: #777;
            font-weight: bold;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header" id="header">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <div id="quiz-screen">
        <div class="question-header" id="question-header"></div>
        <div class="options" id="options-container"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Урок завершён!</h2>
        <div class="score-text" id="score-text"></div>
    </div>

    <div class="footer">
        <button class="btn" id="action-btn" disabled>Проверить</button>
    </div>
</div>

        {"name": "Дмитрий Анатольевич Медведев", "years": "2008-2012", "image": "images/image35.png"}

    const totalQuestions = 5;
    let quizData = [];
    let currentIndex = 0;
    let score = 0;
    let selectedOptionDiv = null;
    let currentCorrectAnswer = '';

    const questionHeader = document.getElementById('question-header');
    const optionsContainer = document.getElementById('options-container');
    const actionBtn = document.getElementById('action-btn');
    const progressBar = document.getElementById('progress-bar');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const scoreText = document.getElementById('score-text');
    const header = document.getElementById('header');

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startGame() {
        quizData = shuffle([...allData]).slice(0, totalQuestions);
        currentIndex = 0;
        score = 0;
        quizScreen.classList.remove('hidden');
        resultScreen.classList.add('hidden');
        header.classList.remove('hidden');
        actionBtn.textContent = 'Проверить';
        actionBtn.classList.remove('continue');
        updateProgress(0);
        loadQuestion();
    }

    function loadQuestion() {
        const currentItem = quizData[currentIndex];
        optionsContainer.innerHTML = '';
        selectedOptionDiv = null;
        actionBtn.disabled = true;
        actionBtn.textContent = 'Проверить';
        actionBtn.classList.remove('continue');

        let optionsList = [];

        if (currentItem.event) {
            questionHeader.innerHTML = `<h2>${currentItem.event}</h2>`;
            currentCorrectAnswer = currentItem.date;
            
            let wrongAnswers = allData
                .filter(d => d.event && d.date !== currentItem.date)
                .map(d => d.date);
            wrongAnswers = shuffle(wrongAnswers).slice(0, 3);
            optionsList = shuffle([currentCorrectAnswer, ...wrongAnswers]);
        } else {
            questionHeader.innerHTML = `
                <img src="${currentItem.image}" alt="Портрет" class="portrait">
                <h2 style="margin-bottom: 5px;">Кто на портрете?</h2>
                <div class="person-years">${currentItem.years}</div>
            `;
            currentCorrectAnswer = currentItem.name;

            let wrongAnswers = allData
                .filter(d => d.name && d.name !== currentItem.name)
                .map(d => d.name);
            wrongAnswers = shuffle(wrongAnswers).slice(0, 3);
            optionsList = shuffle([currentCorrectAnswer, ...wrongAnswers]);
        }

        optionsList.forEach(text => {
            const div = document.createElement('div');
            div.className = 'option';
            div.textContent = text;
            div.onclick = () => selectOption(div);
            optionsContainer.appendChild(div);
        });
    }

    function selectOption(div) {
        if (actionBtn.textContent === 'Дальше') return; 
        
        document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        selectedOptionDiv = div;
        actionBtn.disabled = false;
    }

    function updateProgress(value) {
        progressBar.style.width = `${value}%`;
    }

    actionBtn.onclick = () => {
        if (actionBtn.textContent === 'Дальше' || actionBtn.textContent === 'Пройти заново') {
            currentIndex++;
            if (currentIndex < totalQuestions) {
                loadQuestion();
            } else if (currentIndex === totalQuestions) {
                showResults();
            } else {
                startGame();
            }
            return;
        }

        document.querySelectorAll('.option').forEach(div => {
            if (div.textContent === currentCorrectAnswer) {
                div.classList.add('correct');
            }
            if (div.classList.contains('selected') && div.textContent !== currentCorrectAnswer) {
                div.classList.add('wrong');
            }
        });

        if (selectedOptionDiv && selectedOptionDiv.textContent === currentCorrectAnswer) {
            score++;
        }

        updateProgress(((currentIndex + 1) / totalQuestions) * 100);
        
        actionBtn.textContent = 'Дальше';
        actionBtn.classList.add('continue');
    };

    function showResults() {
        quizScreen.classList.add('hidden');
        header.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        scoreText.textContent = `Твой результат: ${score} из ${totalQuestions}`;
        actionBtn.textContent = 'Пройти заново';
        actionBtn.classList.remove('continue');
    }

    startGame();
</script>
